    function getDB() {
      const saved = localStorage.getItem('college_erp_db_v2');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      localStorage.setItem('college_erp_db_v2', JSON.stringify(initialDatabase));
      return JSON.parse(JSON.stringify(initialDatabase));
    }

    function saveDB(state) {
      localStorage.setItem('college_erp_db_v2', JSON.stringify(state));
    }

    const ERP = {
      login(identifier, password, role) {
        const state = getDB();
        let user = null;
        if (role === 'admin') {
          user = { id: 1, username: 'admin', role: 'admin', displayName: 'Dr. Evelyn Vance (Admin)' };
        } else if (role === 'faculty') {
          user = { id: 2, username: 'prof_alan', role: 'faculty', displayName: 'Prof. Alan Turing (CS Dept)' };
        } else {
          const matched = state.students.find(s => s.roll_number.toLowerCase() === identifier.toLowerCase()) || state.students[0];
          user = {
            id: matched.id + 3,
            username: matched.roll_number,
            role: 'student',
            studentId: matched.id,
            rollNumber: matched.roll_number,
            displayName: `${matched.first_name} ${matched.last_name}`,
            department: matched.department,
          };
        }
        return { success: true, user };
      },

      getStudents(search = '') {
        const state = getDB();
        let list = state.students;
        if (search) {
          const q = search.toLowerCase();
          list = list.filter(s =>
            s.roll_number.toLowerCase().includes(q) ||
            s.first_name.toLowerCase().includes(q) ||
            s.last_name.toLowerCase().includes(q) ||
            s.department.toLowerCase().includes(q)
          );
        }
        return { students: list };
      },

      createStudent(data) {
        const state = getDB();
        const newId = (state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) : 0) + 1;
        const student = {
          id: newId,
          roll_number: data.roll_number,
          first_name: data.first_name,
          last_name: data.last_name,
          department: data.department,
          semester: parseInt(data.semester, 10) || 1,
          contact_email: data.contact_email,
          phone: data.phone || '+1 (555) 000-0000',
          enrollment_date: new Date().toISOString().split('T')[0],
        };
        state.students.push(student);
        state.fees.push({
          id: state.fees.length + 1,
          student_id: newId,
          semester: student.semester,
          academic_year: '2024-2025',
          total_amount: 4500.00,
          paid_amount: 0.00,
          remaining_amount: 4500.00,
          due_date: '2024-12-15',
          status: 'due',
          last_payment_date: null,
        });
        saveDB(state);
        return student;
      },

      deleteStudent(id) {
        const state = getDB();
        state.students = state.students.filter(s => s.id !== id);
        state.attendance = state.attendance.filter(a => a.student_id !== id);
        state.fees = state.fees.filter(f => f.student_id !== id);
        saveDB(state);
      },

      getAttendanceSummary(studentId) {
        const state = getDB();
        const records = state.attendance.filter(a => a.student_id === studentId);
        const total = records.length;
        const attended = records.filter(a => a.status === 'present').length;
        const absent = records.filter(a => a.status === 'absent').length;
        const late = records.filter(a => a.status === 'late').length;

        const percentage = total > 0 ? parseFloat(((attended / total) * 100).toFixed(1)) : 0;
        const isBelow75 = total > 0 && percentage < 75.0;
        const needed = isBelow75 ? Math.max(0, Math.ceil((0.75 * total - attended) / 0.25)) : 0;

        const courses = ['CS-301', 'CS-302', 'MATH-201'].map(code => {
          const cRecs = records.filter(r => r.course_code === code);
          const cTotal = cRecs.length;
          const cAtt = cRecs.filter(r => r.status === 'present').length;
          return {
            course_code: code,
            course_name: code === 'CS-301' ? 'Data Structures & Algorithms' : (code === 'CS-302' ? 'Database Management Systems' : 'Discrete Mathematics'),
            course_total: cTotal,
            course_attended: cAtt,
            course_percentage: cTotal > 0 ? parseFloat(((cAtt / cTotal) * 100).toFixed(1)) : 0,
          };
        });

        return {
          totalSessions: total,
          attendedSessions: attended,
          absentSessions: absent,
          lateSessions: late,
          attendancePercentage: percentage,
          isBelow75Warning: isBelow75,
          classesNeededToRecover: needed,
          courses,
          recentSessions: records.slice().reverse(),
        };
      },

      markAttendance(data) {
        const state = getDB();
        const rec = {
          id: state.attendance.length + 1,
          student_id: data.studentId,
          course_code: data.courseCode,
          session_date: data.sessionDate,
          status: data.status,
          remarks: data.remarks || 'Updated via portal',
        };
        const idx = state.attendance.findIndex(a => a.student_id === rec.student_id && a.course_code === rec.course_code && a.session_date === rec.session_date);
        if (idx >= 0) state.attendance[idx] = rec;
        else state.attendance.push(rec);
        saveDB(state);
      },

      getFees(studentId = null) {
        const state = getDB();
        let fees = state.fees;
        if (studentId) fees = fees.filter(f => f.student_id === studentId);

        const list = fees.map(f => {
          const stu = state.students.find(s => s.id === f.student_id) || {};
          return {
            ...f,
            roll_number: stu.roll_number || 'N/A',
            student_name: stu.first_name ? `${stu.first_name} ${stu.last_name}` : 'Unknown',
            department: stu.department || 'N/A',
          };
        });

        let totalAssessed = 0, totalPaid = 0, totalRemaining = 0, hasDue = false;
        list.forEach(f => {
          totalAssessed += f.total_amount;
          totalPaid += f.paid_amount;
          totalRemaining += f.remaining_amount;
          if (f.remaining_amount > 0 && f.status === 'due') hasDue = true;
        });

        return {
          list,
          totalAssessed,
          totalPaid,
          totalRemaining,
          hasDue,
        };
      },

      recordPayment(feeId, amount) {
        const state = getDB();
        const fee = state.fees.find(f => f.id === feeId);
        if (fee) {
          fee.paid_amount = Math.min(fee.total_amount, fee.paid_amount + parseFloat(amount));
          fee.remaining_amount = fee.total_amount - fee.paid_amount;
          fee.status = fee.remaining_amount <= 0 ? 'paid' : 'due';
          fee.last_payment_date = new Date().toISOString().split('T')[0];
          saveDB(state);
        }
      }
    };

    function AdminDashboard({ user }) {

      const [students, setStudents] = useState([]);
      const [search, setSearch] = useState('');
      const [showAdd, setShowAdd] = useState(false);
      const [selectedStudentId, setSelectedStudentId] = useState(1);
      const [attSummary, setAttSummary] = useState(null);
      const [markData, setMarkData] = useState({ courseCode: 'CS-301', sessionDate: new Date().toISOString().split('T')[0], status: 'present', remarks: 'Admin verified' });
      const [fees, setFees] = useState([]);
      const [payModal, setPayModal] = useState({ open: false, feeId: null, amount: '' });
      const [newStudent, setNewStudent] = useState({ roll_number: '', first_name: '', last_name: '', department: 'Computer Science & Engineering', semester: 1, contact_email: '' });

      const refresh = () => {
        setStudents(ERP.getStudents(search).students);
        if (selectedStudentId) setAttSummary(ERP.getAttendanceSummary(selectedStudentId));
        setFees(ERP.getFees().list);
      };

      useEffect(() => { refresh(); }, [search, selectedStudentId]);

      const handleAddStudent = (e) => {
        e.preventDefault();
        ERP.createStudent(newStudent);
        setShowAdd(false);
        setNewStudent({ roll_number: '', first_name: '', last_name: '', department: 'Computer Science & Engineering', semester: 1, contact_email: '' });
        refresh();
      };

      const handleDelete = (id) => {
        if (confirm('Delete this student from system database?')) {
          ERP.deleteStudent(id);
          refresh();
        }
      };

      const handleMarkAtt = (e) => {
        e.preventDefault();
        ERP.markAttendance({ studentId: selectedStudentId, ...markData });
        refresh();
      };

      const handleRecordPayment = (e) => {
        e.preventDefault();
        ERP.recordPayment(payModal.feeId, payModal.amount);
        setPayModal({ open: false, feeId: null, amount: '' });
        refresh();
      };

      return (
        <div className="space-y-6">

                <>
                  <div className="grid grid-cols-3 gap-2 text-center">
                    <div className="bg-[#FAF8F2] p-3 rounded-xl border border-gray-200">
                      <div className="text-lg font-black text-gray-900">${feeInfo.totalAssessed.toLocaleString()}</div>
                      <div className="text-[10px] text-gray-500 font-bold uppercase">Assessed</div>
                    </div>
                    <div className="bg-[#FAF8F2] p-3 rounded-xl border border-gray-200">
                      <div className="text-lg font-black text-emerald-700">${feeInfo.totalPaid.toLocaleString()}</div>
                      <div className="text-[10px] text-gray-500 font-bold uppercase">Paid</div>
                    </div>
                    <div className="bg-[#FAF8F2] p-3 rounded-xl border-2 border-amber-400 bg-amber-50">
                      <div className="text-lg font-black text-amber-800 font-mono">${feeInfo.totalRemaining.toLocaleString()}</div>
                      <div className="text-[10px] text-amber-900 font-extrabold uppercase">Remaining Fee</div>
                    </div>
                  </div>

                  <div className="border border-gray-200 rounded-xl overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-[#FAF8F2] border-b text-[10px] text-gray-600 font-bold uppercase">
                        <tr>
                          <th className="p-2.5">Semester</th>
                          <th className="p-2.5">Total</th>
                          <th className="p-2.5">Paid</th>
                          <th className="p-2.5">Remaining</th>
                          <th className="p-2.5">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {feeInfo.list.map(f => (
                          <tr key={f.id}>
                            <td className="p-2.5 font-semibold">Sem {f.semester}</td>
                            <td className="p-2.5">${f.total_amount.toLocaleString()}</td>
                            <td className="p-2.5 text-emerald-700">${f.paid_amount.toLocaleString()}</td>
                            <td className="p-2.5 font-mono font-bold text-amber-700">${f.remaining_amount.toLocaleString()}</td>
                            <td className="p-2.5"><span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${f.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>{f.status}</span></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Pay Modal */}
          {payModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border">
                <h3 className="font-bold text-base text-gray-900 pb-2 border-b">Submit Tuition Fee Payment</h3>
                <form onSubmit={handlePay} className="space-y-4 pt-3">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Amount ($)</label>
                    <input type="number" step="0.01" required value={amount} onChange={e => setAmount(e.target.value)} className="input-portal w-full p-2 rounded-lg text-sm font-mono font-bold" />
                  </div>
                  <div className="flex justify-end gap-2">
                    <button type="button" onClick={() => setPayModal(false)} className="px-3 py-1.5 border rounded-lg text-xs">Cancel</button>
                    <button type="submit" className="btn-primary px-4 py-1.5 rounded-lg text-xs font-bold">Authorize Payment</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. ROOT APP ORCHESTRATOR
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
      };

      const handleSignOut = () => {
        setCurrentUser(null);
      };

      const handleSwitchRole = (newRole) => {
        const res = ERP.login(
          newRole === 'student' ? 'STU-2024-0041' : (newRole === 'faculty' ? 'FAC-BIO-8902' : 'ADM-SEC-0112'),
          'UniversityPass2024!',
          newRole
        );
        setCurrentUser(res.user);
      };

      return (
        <div className="min-h-screen bg-[#FAF7EE] text-[#18191B] flex flex-col font-sans">
          {!currentUser ? (
            <LoginView onLoginSuccess={handleLoginSuccess} />
          ) : (
            <div className="flex flex-col min-h-screen">
              <Navbar currentUser={currentUser} onSwitchRole={handleSwitchRole} onSignOut={handleSignOut} />
              <main className="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-8 py-8">
                {currentUser.role === 'admin' && <AdminDashboard user={currentUser} />}
                {currentUser.role === 'faculty' && <FacultyDashboard user={currentUser} />}
                {currentUser.role === 'student' && <StudentDashboard user={currentUser} />}
              </main>
              <footer className="bg-[#FAF7EE] border-t border-[#ECE5D5] px-4 sm:px-8 py-4 text-[11px] text-gray-500 text-center">
                ERP-Based Student Management System • Powered by ReactJS, NodeJS & PostgreSQL • Design System 1:1
              </footer>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
